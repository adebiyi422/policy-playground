<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policy Playground</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root { --bg:#fff; --layer:#f4f4f4; --text:#161616; --muted:#525252; --border:#e0e0e0;
          --blue:#0f62fe; --red-bg:#fff1f1; --red:#da1e28; --green-bg:#defbe6; --green:#198038; --amber-bg:#fcf4d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --layer:#262626; --text:#f4f4f4; --muted:#c6c6c6; --border:#393939;
            --blue:#78a9ff; --red-bg:#2d0709; --red:#ff8389; --green-bg:#071908; --green:#42be65; --amber-bg:#302400; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  header { background:#161616; color:#f4f4f4; padding:12px 16px; font-weight:600; }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  p.lede { color:var(--muted); margin:0 0 16px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chips button { border:1px solid var(--border); background:var(--layer); color:var(--text); padding:6px 12px; cursor:pointer; font:inherit; }
  .chips button:hover { border-color:var(--blue); }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input { flex:1; min-width:0; padding:10px; font:inherit; border:1px solid var(--border); background:var(--layer); color:var(--text); }
  button.primary { background:var(--blue); color:#fff; border:0; padding:10px 16px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:760px) { .cols { grid-template-columns:1fr; } }
  .col { border:1px solid var(--border); padding:16px; min-width:0; }
  .col h2 { margin:0 0 4px; font-size:18px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:8px; overflow-wrap:anywhere; }
  .verdict { padding:8px 12px; margin:8px 0; font-size:14px; }
  .bad { background:var(--red-bg); border-left:3px solid var(--red); }
  .good { background:var(--green-bg); border-left:3px solid var(--green); }
  .hold { background:var(--amber-bg); border-left:3px solid #f1c21b; }
  .answer { overflow-wrap:anywhere; }
  .answer table { border-collapse:collapse; display:block; overflow-x:auto; }
  .answer td, .answer th { border:1px solid var(--border); padding:4px 8px; }
  .approve { display:flex; gap:8px; margin-top:8px; }
  .approve button { padding:8px 14px; font:inherit; cursor:pointer; border:0; }
  .yes { background:var(--green); color:#fff; } .no { background:var(--red); color:#fff; }
</style>
</head>
<body>
<header>CUGA Policy Playground</header>
<main>
  <p class="lede">Two CUGA agents get the same message. Same model, same Oak Health tools. Only the right one has policies.
    You are member John Doe (121231234). Data resets before every message.</p>
  <div class="chips" id="chips"></div>
  <form id="form"><input id="msg" placeholder="Or type your own message" maxlength="600"><button class="primary" id="send">Send</button></form>
  <div class="cols">
    <section class="col"><h2>Without policies</h2><div id="without"><p class="meta">Pick a scenario above.</p></div></section>
    <section class="col"><h2>With policies</h2><div id="with"><p class="meta">Pick a scenario above.</p></div></section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const md = text => (window.marked && window.DOMPurify) ? DOMPurify.sanitize(marked.parse(text || "")) :
  (text || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/\n/g, "<br>");

function render(side, out) {
  let verdict;
  if (out.paused) verdict = `<div class="verdict hold">Paused: waiting for your approval</div>
     <div class="approve"><button class="yes" onclick="decide(true)">Approve</button><button class="no" onclick="decide(false)">Decline</button></div>`;
  else if (out.broken.length) verdict = `<div class="verdict bad"><b>Rules broken:</b><br>${out.broken.join("<br>")}</div>`;
  else verdict = `<div class="verdict good">No rules broken</div>`;
  $(side).innerHTML = `
    <p class="meta">Tools: ${out.tools.join(", ") || "none"}${out.approvals ? ` · asked for approval ${out.approvals}×` : ""}</p>
    ${out.policies.length ? `<p class="meta">Policies: ${out.policies.join(" · ")}</p>` : ""}
    ${verdict}
    <div class="answer">${out.paused ? "" : md(out.answer)}</div>
    <p class="meta">Bills now: ${Object.entries(out.bills).map(([k, v]) => k + " " + v).join(" · ")}</p>`;
}

function busy(on) { document.querySelectorAll("button").forEach(b => b.disabled = on); }

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

async function send(message) {
  busy(true);
  ["without", "with"].forEach(s => $(s).innerHTML = `<p class="meta">Thinking… (about 30 seconds)</p>`);
  try { const res = await post("/api/ask", {message}); render("without", res.without); render("with", res.with); }
  catch (e) { $("with").innerHTML = `<div class="verdict bad">${e.message}</div>`; }
  busy(false);
}

async function decide(approve) {
  busy(true);
  $("with").innerHTML = `<p class="meta">${approve ? "Approved" : "Declined"}. Continuing…</p>`;
  try { render("with", (await post("/api/approve", {approve})).with); }
  catch (e) { $("with").innerHTML = `<div class="verdict bad">${e.message}</div>`; }
  busy(false);
}

fetch("/api/scenarios").then(r => r.json()).then(list => list.forEach(sc => {
  const b = document.createElement("button"); b.textContent = sc.label; b.title = sc.message;
  b.onclick = () => { $("msg").value = sc.message; send(sc.message); }; $("chips").appendChild(b);
}));
$("form").onsubmit = e => { e.preventDefault(); const m = $("msg").value.trim(); if (m) send(m); };
</script>
</body>
</html>
